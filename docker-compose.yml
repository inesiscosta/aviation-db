volumes:
  pg_data: {}
  pgadmin_data: {}
  redis_data: {}

name: "bd-ist"

services:
  notebook:
    restart: unless-stopped
    image: ghcr.io/bdist/notebook:2025-02-18
    volumes:
      - ./app:/home/jovyan/app
      - ./notebooks:/home/jovyan/notebooks
      - ./container-init/aviacao.sql:/home/jovyan/data/aviacao.sql:ro
    environment:
      - JUPYTER_PORT=9999
      - JUPYTER_PASSWORD=${JUPYTER_PASSWORD}
    ports:
      - 9999:9999
    command: "start-notebook.sh --NotebookApp.token='${JUPYTER_PASSWORD}'"
    networks:
      - network
  postgres:
    restart: unless-stopped
    image: postgres:17
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    shm_size: "256m"
    volumes:
      - pg_data:/var/lib/postgresql/data:Z
      - ./container-init/stat_extension.sql:/docker-entrypoint-initdb.d/stat_extension.sql:ro
      - ./container-init/create-app-db.sql:/docker-entrypoint-initdb.d/create-app-db.sql:ro
      - ./container-init/aviacao.sql:/schema/aviacao.sql:ro
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    networks:
      - network

  app:
    restart: unless-stopped
    depends_on:
      - postgres
    build:
      context: ./app
      dockerfile: Dockerfile.development
    volumes:
      - ./app:/app
    environment:
      FLASK_APP: app
      FLASK_ENV: development
      FLASK_DEBUG: 1
      FLASK_SECRET_KEY: 66342083928cc29310851e51d931ea35ebb4b5747bd2a33e0d06c3d6047c83c8
    ports:
      - 8080:8080
    networks:
      - network

networks:
  network:
    driver: bridge
